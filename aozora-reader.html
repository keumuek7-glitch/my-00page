<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아오조라 독서 도우미</title>
<meta name="description" content="아오조라 문고의 일본어 본문을 붙여 넣으면 한국어 번역과 등장인물 소개를 만들고, 직접 만든 인물 그림을 올려 관계도를 완성하는 웹앱">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+JP:wght@400;600&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f2f6fa; --panel:#ffffff; --ink:#1d2536; --ink2:#566175; --line:#d3dce7;
  --ai:#2b4a8c; --ai-ink:#ffffff; --sora:#cfe5f7; --sora2:#eaf3fb;
  --warn:#b4452f; --ok:#2f7a5b;
  --sans:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --serif-ko:'Noto Serif KR','Nanum Myeongjo','Apple Myungjo',serif;
  --serif-ja:'Noto Serif JP','Yu Mincho','Hiragino Mincho ProN',serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#121a27; --panel:#1a2433; --ink:#e6ecf5; --ink2:#9fb0c6; --line:#2c3a50;
    --ai:#8fb4ff; --ai-ink:#0e1a30; --sora:#1f3350; --sora2:#16253a;
    --warn:#ef8a74; --ok:#6cc9a0;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--sans)}
a{color:var(--ai)}
.skip{position:absolute;left:-999px;top:0;background:var(--ai);color:var(--ai-ink);padding:8px 12px;z-index:10}
.skip:focus{left:8px;top:8px}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.top{padding:28px 0 4px}
h1{font:700 clamp(26px,5vw,38px)/1.2 var(--serif-ko);margin:0 0 8px;letter-spacing:-.01em}
h1 [lang=ja]{font-family:var(--serif-ja);font-weight:600;color:var(--ai);margin-right:.28em}
.lede{margin:0;color:var(--ink2);max-width:62ch}
h2{font:600 18px/1.4 var(--sans);margin:0 0 10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin:16px 0}
details.panel>summary{cursor:pointer;font-weight:600;list-style-position:inside}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.grid .wide{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink2)}
label.check{flex-direction:row;align-items:center;gap:8px}
input[type=text],input[type=password],input[type=number],textarea{
  width:100%;font:16px/1.5 var(--sans);color:var(--ink);background:var(--paper);
  border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{resize:vertical}
#src{min-height:200px;font-family:var(--serif-ja);line-height:1.8}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.hint{font-size:13px;color:var(--ink2);margin:8px 0 0}
.btn{font:500 15px/1 var(--sans);min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--ai);
  background:var(--ai);color:var(--ai-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ai)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px;line-height:1.3}
.btn:disabled{opacity:.45;cursor:not-allowed}
.opts{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0}
.steps{list-style:none;margin:0 0 4px;padding:0;display:flex;flex-wrap:wrap;gap:8px 22px}
.steps li{display:flex;align-items:flex-start;gap:8px;font-size:14px}
.steps .n{white-space:nowrap;flex:none}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none;margin-top:7px}
.steps li[data-s=busy] .dot{background:var(--ai)}
.steps li[data-s=done] .dot{background:var(--ok)}
.steps li[data-s=error] .dot{background:var(--warn)}
.steps .t{color:var(--ink2);min-width:0;overflow-wrap:anywhere}
#notice{min-height:1.4em;font-size:14px;margin:6px 0 0}
#notice.error{color:var(--warn)}
#notice.ok{color:var(--ok)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:20px;overflow-x:auto}
.tab{font:500 15px/1 var(--sans);padding:12px 16px;border:0;background:none;color:var(--ink2);cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ai);border-bottom-color:var(--ai);font-weight:700}
.pane{padding:16px 0 40px}
.empty{color:var(--ink2);padding:24px 0}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:8px}
.para{padding:14px 0;border-bottom:1px solid var(--line)}
.para .ja{font:400 14px/1.8 var(--serif-ja);color:var(--ink2);margin:0 0 6px}
.para .ko{font:400 17px/1.9 var(--serif-ko);margin:0}
.para .ko.missing{color:var(--ink2);font-family:var(--sans);font-size:14px}
.para .ko.fail{color:var(--warn);font-family:var(--sans);font-size:14px}
.hide-ja .para .ja{display:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card .head{display:flex;gap:12px;align-items:center}
.avatar{width:56px;height:56px;border-radius:50%;flex:none;background:var(--sora);overflow:hidden;
  display:grid;place-items:center;font:600 22px var(--serif-ko);color:var(--ai);border:2px solid var(--line)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.card h3{margin:0;font:700 17px/1.3 var(--serif-ko)}
.card .sub{font-size:13px;color:var(--ink2)}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);margin-left:6px;vertical-align:2px}
.card dl{margin:0;display:grid;gap:6px}
.card dt{font-size:12px;color:var(--ink2)}
.card dd{margin:0;font-size:15px}
.imggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;align-items:start}
figure.shot{margin:0 auto;width:100%;max-width:300px;aspect-ratio:9/16;border-radius:8px;overflow:hidden;background:var(--sora2);
  border:2px dashed var(--ink2);position:relative}
figure.shot.filled{border:1px solid var(--line)}
figure.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.slotbtn{position:absolute;inset:0;width:100%;height:100%;border:0;background:none;color:var(--ink2);font:14px/1.5 var(--sans);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;text-align:center}
.slotbtn .plus{font-size:36px;line-height:1;color:var(--ai)}
.slotbtn:hover,.pslot:hover{background:var(--sora)}
.prow{display:flex;gap:12px;align-items:center;padding-top:10px;border-top:1px solid var(--line)}
.pslot{width:76px;height:76px;border-radius:50%;flex:none;position:relative;overflow:hidden;background:var(--sora2);border:2px dashed var(--ink2);
  padding:0;cursor:pointer;color:var(--ai);font:400 30px/1 var(--sans)}
.pslot.filled{border:2px solid var(--line)}
.pslot img{width:100%;height:100%;object-fit:cover;display:block}
.pcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.pcol b{font-size:13px;font-weight:600}
.lede,.hint,.slotbtn,.pcol b{word-break:keep-all;overflow-wrap:anywhere}
.pcol .row{gap:6px}
.dropping{outline:2px dashed var(--ai);outline-offset:2px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,16,28,.6);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:16px;width:min(100%,360px);display:flex;flex-direction:column;gap:12px}
.modal h2{margin:0}
.stage{position:relative;margin:0 auto;overflow:hidden;background:var(--sora2);touch-action:none;cursor:grab;border-radius:6px;user-select:none;-webkit-user-select:none}
.stage:active{cursor:grabbing}
.stage img{position:absolute;left:0;top:0;max-width:none;pointer-events:none}
.stage .ring{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 400px rgba(10,16,28,.55);border:2px solid #fff;pointer-events:none}
.modal input[type=range]{width:100%}
.card{min-width:0}
.card details p{margin:6px 0 0;font-size:12px}
.banner{border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:10px 12px;margin:0 0 12px;overflow-wrap:anywhere}
.banner details p{margin:6px 0 0;font-size:13px;color:var(--ink2)}
.badge{font-size:12px;color:var(--ink2)}
.badge.warn{color:var(--warn)}
.badge{overflow-wrap:anywhere}
.card details summary{cursor:pointer;font-size:13px;color:var(--ink2)}
.card textarea{font-size:14px;margin-top:6px}
.sky{background:linear-gradient(180deg,var(--sora) 0%,var(--sora2) 100%);border:1px solid var(--line);border-radius:12px;overflow:auto}
.sky svg{display:block;width:100%;min-width:640px;height:auto}
.scrollhint{display:none;font-size:13px;color:var(--ink2);margin:6px 0 0}
@media (max-width:700px){.scrollhint{display:block}}
.node{cursor:pointer}
.relist{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
.relist li{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:15px}
.relist .lab{font-weight:700;color:var(--ai);margin:0 6px}
.relist .det{display:block;font-size:13px;color:var(--ink2);margin-top:2px}
.detail{margin-top:14px}
.foot{display:flex;flex-wrap:wrap;gap:10px;padding:8px 0 48px;border-top:1px solid var(--line);margin-top:8px}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#input">입력창으로 건너뛰기</a>
<header class="top">
  <div class="wrap">
    <h1><span lang="ja">青空</span>독서 도우미</h1>
    <p class="lede">아오조라 문고의 일본어 본문을 붙여 넣으면 한국어 번역, 등장인물 소개, 관계도를 만들어 줍니다. 인물 그림은 직접 만든 이미지를 올려서 채웁니다.</p>
  </div>
</header>

<main class="wrap">
  <details id="settings" class="panel">
    <summary>연결 설정</summary>
    <div class="grid">
      <label class="wide">Gemini API 키
        <span class="row">
          <input id="apiKey" type="password" autocomplete="off" spellcheck="false" style="flex:1;min-width:200px">
          <button type="button" id="toggleKey" class="btn ghost small">보기</button>
        </span>
      </label>
      <label class="check wide"><input type="checkbox" id="remember"> 이 브라우저에 키를 저장합니다. 공용 컴퓨터에서는 끄세요.</label>
      <label>텍스트 모델 (번역, 인물 분석)
        <input id="textModel" type="text" list="textModels" autocomplete="off" spellcheck="false">
      </label>
      <label class="wide">그림체 지시문 (영문, 그림 프롬프트 복사에 사용)
        <textarea id="style" rows="2"></textarea>
      </label>
      <div class="row wide">
        <button type="button" id="loadModels" class="btn ghost small">모델 목록 불러오기</button>
        <span id="modelMsg" class="hint" style="margin:0" aria-live="polite"></span>
      </div>
    </div>
    <datalist id="textModels"></datalist>
    <p class="hint">키는 이 페이지에서 구글 서버로 바로 전송되며, 이 앱에는 별도 서버가 없습니다. 키 발급은 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>에서 합니다.</p>
  </details>

  <section class="panel" id="input" aria-labelledby="inputH">
    <h2 id="inputH">일본어 본문</h2>
    <div class="grid">
      <label>작품명 (선택)<input id="workTitle" type="text" autocomplete="off"></label>
      <label>작가 (선택)<input id="workAuthor" type="text" autocomplete="off"></label>
    </div>
    <label style="margin-top:12px">본문
      <textarea id="src" lang="ja" placeholder="아오조라 문고 작품의 본문을 붙여 넣으세요."></textarea>
    </label>
    <div class="opts">
      <label class="check"><input type="checkbox" id="optRuby" checked> 복사하면서 섞인 루비 괄호 제거 (예: 吾輩（わがはい）)</label>
      <label class="check"><span class="btn ghost small" style="display:inline-flex;align-items:center"><input id="fileIn" type="file" accept=".txt,text/plain" style="display:none">텍스트 파일 열기</span></label>
    </div>
    <p id="estimate" class="hint" style="margin-top:0"></p>
    <div class="row" style="margin-top:12px">
      <button type="button" id="go" class="btn">분석 시작</button>
      <button type="button" id="stop" class="btn ghost" disabled>중단</button>
    </div>
    <p id="notice" role="status" aria-live="polite"></p>
  </section>

  <ul class="steps" id="steps" aria-label="진행 상태"></ul>

  <div class="tabs" role="tablist" aria-label="결과" id="tabs"></div>
  <div class="pane" id="pane" role="tabpanel" tabindex="0"></div>

  <div class="foot">
    <button type="button" id="saveJson" class="btn ghost small">결과 저장 (JSON)</button>
    <label class="check"><span class="btn ghost small" style="display:inline-flex;align-items:center"><input id="loadJson" type="file" accept=".json,application/json" style="display:none">결과 불러오기</span></label>
  </div>
</main>
<input id="portraitFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
<input id="profileFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
<noscript><p class="wrap">이 앱은 자바스크립트가 필요합니다.</p></noscript>

<script>
(() => {
'use strict';

/* ================= 유틸 ================= */
const $ = (s, r = document) => r.querySelector(s);
const SVG_NS = 'http://www.w3.org/2000/svg';
const sleep = (ms, signal) => new Promise((res, rej) => {
  const t = setTimeout(res, ms);
  if (signal) signal.addEventListener('abort', () => { clearTimeout(t); rej(new DOMException('중단됨', 'AbortError')); }, { once: true });
});
function build(create, tag, props, kids) {
  const e = create(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.setAttribute('class', v);
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return e;
}
const h = (tag, props, ...kids) => build(t => document.createElement(t), tag, props, kids);
const sv = (tag, props, ...kids) => build(t => document.createElementNS(SVG_NS, t), tag, props, kids);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* 저장 불가 환경 */ } },
  del(k) { try { localStorage.removeItem(k); } catch { /* 저장 불가 환경 */ } }
};
function download(name, blob) {
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
const raf = window.requestAnimationFrame ? f => window.requestAnimationFrame(f) : f => setTimeout(f, 16);

/* ================= 설정 ================= */
const DEFAULT_STYLE = 'Modern Japanese anime illustration, soft cel shading, clean line art, expressive eyes, plain pale blue background.';
const OLD_DEFAULT_STYLE = 'Modern Japanese anime illustration, soft cel shading, clean line art, expressive eyes, head-and-shoulders portrait, plain pale blue background.';
/* 기본값은 gemini-3.5-flash. gemini-3.8-flash는 오류가 나서 기본값에서 뺐다. */
const TEXT_MODELS = ['gemini-3.5-flash', 'gemini-3.5-flash-lite', 'gemini-3.6-flash', 'gemini-3.1-flash-lite', 'gemini-3.8-flash', 'gemini-4-argon'];
const BROKEN_MODELS = ['gemini-3.8-flash'];
const API_BASES = ['https://generativelanguage.googleapis.com/v1beta', 'https://generativelanguage.googleapis.com/v1'];
const ANALYSIS_LIMIT = 200000;
const MAX_CHARACTERS = 12;
const TIMEOUTS = { text: 90000, analysis: 180000 };

const cfg = {
  remember: store.get('aozora.remember', '0') === '1',
  key: '',
  textModel: (v => (BROKEN_MODELS.includes(v) ? TEXT_MODELS[0] : v))(store.get('aozora.textModel', TEXT_MODELS[0])),
  style: (v => (v === OLD_DEFAULT_STYLE ? DEFAULT_STYLE : v))(store.get('aozora.style', DEFAULT_STYLE))
};
if (cfg.remember) cfg.key = store.get('aozora.key', '');

/* ================= 상태 ================= */
const freshSteps = () => ({
  translate: { state: 'idle', done: 0, total: 0, msg: '', detail: '', note: '', startedAt: 0 },
  analyze: { state: 'idle', done: 0, total: 0, msg: '', detail: '', note: '', startedAt: 0 }
});
const state = {
  paragraphs: [], characters: [], relations: [], setting: '', selected: null,
  meta: { title: '', author: '' }, steps: freshSteps(),
  running: false, abort: null, tab: 'translate', showJa: true
};

/* ================= 텍스트 정리 ================= */
function cleanAozora(raw, opts = {}) {
  const stripRubyParen = opts.stripRubyParen !== false;
  let t = String(raw || '').replace(/^﻿/, '').replace(/\r\n?/g, '\n');
  t = t.replace(/-{20,}\n【テキスト中に現れる記号について】[\s\S]*?\n-{20,}\n?/, '');
  const foot = t.search(/^底本[：:]/m);
  if (foot >= 0) t = t.slice(0, foot);
  t = t.replace(/※［＃[^］\n]*］/g, '');
  t = t.replace(/［＃[^］\n]*］/g, '');
  t = t.replace(/《[^》\n]*》/g, '');
  t = t.replace(/｜/g, '');
  if (stripRubyParen) t = t.replace(/([一-鿿々〆ヶ])（[ぁ-ゖァ-ヺー・]+）/g, '$1');
  t = t.replace(/^[ \t　]+/gm, '').replace(/[ \t　]+$/gm, '');
  t = t.replace(/\n{3,}/g, '\n\n').trim();
  return t;
}
const splitParagraphs = t => t.split(/\n+/).map(s => s.trim()).filter(Boolean);
function makeChunks(indices, paras, maxChars = 1600, maxCount = 30) {
  const chunks = []; let cur = []; let len = 0;
  for (const i of indices) {
    const l = paras[i].ja.length;
    if (cur.length && (len + l > maxChars || cur.length >= maxCount)) { chunks.push(cur); cur = []; len = 0; }
    cur.push(i); len += l;
  }
  if (cur.length) chunks.push(cur);
  return chunks;
}
async function readTextFile(file) {
  const buf = await file.arrayBuffer();
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch { return new TextDecoder('shift_jis').decode(buf); }
}

/* ================= Gemini 호출 ================= */
class ApiError extends Error {
  constructor(status, msg, detail) { super(status ? `${msg} (${status})` : msg); this.status = status; this.detail = detail || ''; }
}
const shorten = (s, n = 160) => { s = String(s || ''); return s.length > n ? `${s.slice(0, n)}…` : s; };
const noThinking = new Set();
// 사고 수준: 번역처럼 추론이 필요 없는 작업의 대기 시간을 줄인다. 모델별 허용값은 공식 문서(thinking) 기준.
function thinkingConfigFor(model) {
  const m = String(model || '');
  if (noThinking.has(m)) return undefined;
  if (/^gemini-(3\.8|4)/.test(m)) return { thinkingLevel: 'low' };            // 3.8 Flash와 4는 minimal이 오류
  if (/flash-lite/.test(m)) return undefined;                                  // Flash-Lite는 기본값이 minimal
  if (/^gemini-3(\.\d+)?-flash/.test(m)) return { thinkingLevel: 'minimal' };  // 3 Flash, 3.6 Flash
  return undefined;                                                            // 2.5 등은 기본값 유지
}
function fmtWait(sec) {

  const grid = h('div', { class: 'imggrid' });
  state.characters.forEach(c => {
    const sz = c.portraitSize;
    const off = !!(sz && Math.abs(sz[0] / sz[1] - 9 / 16) > 0.02);
    const note = c.portrait && sz ? h('div', { class: off ? 'badge warn' : 'badge',
      text: off ? `올린 그림은 ${sz[0]}×${sz[1]}px(${ratioText(sz[0], sz[1])})라 9:16 칸에 여백이 생깁니다.` : `${sz[0]}×${sz[1]}px, 9:16` }) : null;
    const shot = h('figure', { class: `shot${c.portrait ? ' filled' : ''}`, ...dropProps(f => setPortrait(c, f)) },
      c.portrait ? h('img', { src: c.portrait, alt: `${c.name_ko} 인물 이미지` })
        : h('button', { type: 'button', class: 'slotbtn', onClick: () => pickFile('portrait', c.id) },
          h('span', { class: 'plus', 'aria-hidden': 'true', text: '+' }),
          h('span', { text: '인물 이미지 (9:16)' }),
          h('span', { text: '눌러서 올리거나 파일을 끌어다 놓기' })));
    const prof = h('div', { class: 'prow' },
      h('button', { type: 'button', class: `pslot${c.profile ? ' filled' : ''}`, 'aria-label': `${c.name_ko} 관계도 프로필 ${c.profile ? '바꾸기' : '올리기'}`,
        onClick: () => pickFile('profile', c.id), ...dropProps(f => startProfile(c, f)) },
        c.profile ? h('img', { src: c.profile, alt: '' }) : '+'),
      h('div', { class: 'pcol' }, h('b', { text: '관계도 프로필 (원형)' }),
        h('div', { class: 'row' },
          h('button', { type: 'button', class: 'btn small', onClick: () => pickFile('profile', c.id) }, c.profile ? '프로필 바꾸기' : '프로필 올리기'),
          h('button', { type: 'button', class: 'btn ghost small', disabled: !c.portrait || null, title: c.portrait ? '' : '인물 이미지를 먼저 올리면 쓸 수 있습니다',
            onClick: () => startProfile(c, c.portrait) }, '인물 이미지에서 가져오기'),
          c.profile ? h('button', { type: 'button', class: 'btn ghost small', onClick: () => { c.profile = null; renderAll(); } }, '삭제') : null,
          c.profile ? h('button', { type: 'button', class: 'btn ghost small', onClick: () => saveImage(c.profile, `${c.name_ko}_프로필`) }, '저장') : null)));
    grid.append(h('article', { class: 'card' }, shot,
      h('h3', {}, c.name_ko, c.role ? h('span', { class: 'pill', text: c.role }) : null),
      note,
      c.upErr ? h('div', { class: 'badge warn', role: 'alert', text: c.upErr }) : null,
      h('div', { class: 'row' },
        h('button', { type: 'button', class: 'btn small', onClick: () => pickFile('portrait', c.id) }, c.portrait ? '인물 이미지 바꾸기' : '인물 이미지 올리기'),
        c.portrait ? h('button', { type: 'button', class: 'btn ghost small', onClick: () => { c.portrait = null; c.portraitSize = null; renderAll(); } }, '삭제') : null,
        c.portrait ? h('button', { type: 'button', class: 'btn ghost small', onClick: () => saveImage(c.portrait, `${c.name_ko}_9x16`) }, '저장') : null),
      prof,
      h('details', {}, h('summary', { text: '그림 프롬프트 (직접 생성용)' }),
        h('p', { class: 'hint', text: c.appearanceKnown ? '본문의 외모 묘사를 반영한 프롬프트입니다.' : '본문에 외모 묘사가 없어 일반적인 모습으로 쓴 프롬프트입니다.' }),
        h('textarea', { rows: 4, 'data-focus': `ap-${c.id}`, onInput: e => { c.appearance = e.target.value; } }, c.appearance),
        h('div', { class: 'row', style: 'margin-top:8px' }, copyBtn('인물 이미지 프롬프트 복사', () => portraitPrompt(c)), copyBtn('프로필 프롬프트 복사', () => profilePrompt(c))))));
  });
  grid.querySelectorAll('textarea').forEach((ta, i) => { ta.value = state.characters[i].appearance; });
  return h('div', {}, intro, tally, grid);
}
function paneGraph() {
  if (!state.characters.length) return paneNoChars();
  const wrap = h('div', {},
    h('div', { class: 'toolbar' },
      h('button', { class: 'btn ghost small', onClick: exportPNG }, '관계도 PNG 저장'),
      h('span', { class: 'hint', style: 'margin:0', text: '비어 있는 원의 + 버튼을 누르거나 이미지 파일을 원 위로 끌어다 놓으면 프로필을 올릴 수 있습니다.' })),
    h('div', { class: 'sky', id: 'graph' }, buildGraph()),
    h('p', { class: 'scrollhint', text: '화면이 좁으면 관계도를 좌우로 밀어 전체를 볼 수 있습니다.' }));
  const sel = state.characters.find(c => c.id === state.selected);
  const rels = state.relations.filter(r => !sel || r.from === sel.id || r.to === sel.id);
  const name = id => (state.characters.find(c => c.id === id) || {}).name_ko || '';
  if (sel) wrap.append(h('article', { class: 'card detail' },
    h('div', { class: 'head' }, avatar(sel), h('div', {}, h('h3', { text: sel.name_ko }), h('div', { class: 'sub', text: sel.role }))),
    h('div', { class: 'row' },
      h('button', { type: 'button', class: 'btn small', onClick: () => pickFile('profile', sel.id) }, sel.profile ? '프로필 바꾸기' : '프로필 올리기'),
      sel.portrait ? h('button', { type: 'button', class: 'btn ghost small', onClick: () => startProfile(sel, sel.portrait) }, '인물 이미지에서 가져오기') : null,
      sel.profile ? h('button', { type: 'button', class: 'btn ghost small', onClick: () => { sel.profile = null; renderAll(); } }, '프로필 삭제') : null),
    sel.upErr ? h('div', { class: 'badge warn', role: 'alert', text: sel.upErr }) : null,
    h('dl', {}, sel.personality ? h('div', {}, h('dt', { text: '성격' }), h('dd', { text: sel.personality })) : null,
      sel.summary ? h('div', {}, h('dt', { text: '소개' }), h('dd', { text: sel.summary })) : null)));
  wrap.append(h('ul', { class: 'relist' }, rels.length ? rels.map(r => h('li', {}, name(r.from), h('span', { class: 'lab', text: r.label }), name(r.to),
    r.detail ? h('span', { class: 'det', text: r.detail }) : null)) : h('li', { text: '표시할 관계가 없습니다.' })));
  return wrap;
}
function renderPanel() {
  const pane = $('#pane');
  const active = document.activeElement;
  const key = active && active.dataset ? active.dataset.focus : null;
  const pos = key && active.selectionStart != null ? active.selectionStart : null;
  const fn = { translate: paneTranslate, people: panePeople, images: paneImages, graph: paneGraph }[state.tab];
  pane.replaceChildren(fn());
  if (key) { const again = pane.querySelector(`[data-focus="${key}"]`); if (again) { again.focus(); if (pos != null) again.setSelectionRange(pos, pos); } }
}
function renderControls() {
  $('#go').disabled = state.running; $('#stop').disabled = !state.running;
}
function renderAll() { renderSteps(); renderTabs(); renderPanel(); renderControls(); }

/* ================= 입력 보조 ================= */
let estTimer = 0;
function updateEstimate() {
  clearTimeout(estTimer);
  estTimer = setTimeout(() => {
    const cleaned = cleanAozora($('#src').value, { stripRubyParen: $('#optRuby').checked });
    const paras = splitParagraphs(cleaned);
    const el = $('#estimate');
    if (!paras.length) { el.textContent = ''; return; }
    const chunks = makeChunks(paras.map((_, i) => i), paras.map(ja => ({ ja })));
    const over = cleaned.length > ANALYSIS_LIMIT ? ` 인물 분석은 앞 ${ANALYSIS_LIMIT.toLocaleString()}자만 사용합니다.` : '';
    el.textContent = `정리 후 ${cleaned.length.toLocaleString()}자, 문단 ${paras.length.toLocaleString()}개입니다. 번역 ${chunks.length}회와 분석 1회를 요청합니다. 요청이 많을수록 오래 걸리고 사용량이 늘어납니다.${over}`;
  }, 250);
}
async function loadModels() {
  if (!cfg.key) { $('#modelMsg').textContent = 'API 키를 먼저 입력하세요.'; return; }
  const msg = $('#modelMsg'); msg.textContent = '불러오는 중…';
  try {
    let list = [], token = '';
    do {
      const res = await fetch(`${API_BASES[0]}/models?pageSize=200${token ? `&pageToken=${encodeURIComponent(token)}` : ''}`, { headers: { 'x-goog-api-key': cfg.key } });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new ApiError(res.status, (data.error && data.error.message) || '목록을 불러오지 못했습니다');
      list = list.concat(data.models || []); token = data.nextPageToken || '';
    } while (token);
    const names = list.filter(m => (m.supportedGenerationMethods || []).includes('generateContent')).map(m => String(m.name).replace(/^models\//, ''));
    const txt = names.filter(n => /^gemini-/.test(n) && !/(image|tts|live|embedding|transcribe|omni|robotics|computer-use|nano-banana|translate)/i.test(n));
    fillList('#textModels', txt.length ? txt : TEXT_MODELS);
    msg.textContent = `연결되었습니다. 텍스트 모델 ${txt.length}개를 불러왔습니다.`;
  } catch (e) { msg.textContent = `실패: ${e.message}`; }
}
function fillList(sel, items) { const dl = $(sel); dl.replaceChildren(...items.map(v => h('option', { value: v }))); }

/* ================= 저장·불러오기 ================= */
function exportJSON() {
  if (!state.paragraphs.length) { notice('저장할 결과가 없습니다.', 'error'); return; }
  const data = { version: 2, meta: state.meta, setting: state.setting,
    paragraphs: state.paragraphs.map(({ ja, ko }) => ({ ja, ko })),
    characters: state.characters.map(({ upErr, ...rest }) => rest), relations: state.relations };
  download('aozora-result.json', new Blob([JSON.stringify(data)], { type: 'application/json' }));
}
async function importJSON(file) {
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.paragraphs) || !Array.isArray(data.characters)) throw new Error('형식이 맞지 않습니다');
    state.meta = data.meta || { title: '', author: '' }; state.setting = data.setting || '';
    state.paragraphs = data.paragraphs.map(p => ({ ja: String(p.ja || ''), ko: p.ko || null, err: false }));
    const okImg = v => (typeof v === 'string' && /^data:image\/(png|jpe?g|webp|gif);base64,/.test(v)) ? v : null;
    const okSize = v => (Array.isArray(v) && v.length === 2 && v.every(x => Number.isFinite(x) && x > 0)) ? [v[0], v[1]] : null;
    state.characters = data.characters.map(c => {
      const { image, locked, imgState, imgError, imgNote, portrait, portraitSize, profile, ...rest } = c;   // 예전 저장본의 image는 정사각형 얼굴 그림이므로 프로필로 옮긴다
      const pt = okImg(portrait);
      return { ...rest, portrait: pt, portraitSize: pt ? okSize(portraitSize) : null, profile: okImg(profile) || okImg(image), upErr: '' };
    });
    state.relations = Array.isArray(data.relations) ? data.relations : []; state.selected = null;
    state.steps = freshSteps();
    state.steps.translate.state = state.paragraphs.every(p => p.ko) ? 'done' : 'idle';
    if (state.characters.length) state.steps.analyze.state = 'done';
    $('#workTitle').value = state.meta.title || ''; $('#workAuthor').value = state.meta.author || '';
    notice('저장한 결과를 불러왔습니다.', 'ok'); renderAll();
  } catch (e) { notice(`불러오지 못했습니다: ${e.message}`, 'error'); }
}

/* ================= 초기화 ================= */
function init() {
  $('#apiKey').value = cfg.key; $('#remember').checked = cfg.remember;
  $('#textModel').value = cfg.textModel; $('#style').value = cfg.style;
  fillList('#textModels', TEXT_MODELS);
  if (!cfg.key) $('#settings').open = true;
  $('#apiKey').addEventListener('input', e => { cfg.key = e.target.value.trim(); if (cfg.remember) store.set('aozora.key', cfg.key); });
  $('#toggleKey').addEventListener('click', e => { const i = $('#apiKey'); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; e.target.textContent = show ? '숨기기' : '보기'; });
  $('#remember').addEventListener('change', e => {
    cfg.remember = e.target.checked; store.set('aozora.remember', cfg.remember ? '1' : '0');
    if (cfg.remember) store.set('aozora.key', cfg.key); else store.del('aozora.key');
  });
  $('#textModel').addEventListener('input', e => { cfg.textModel = e.target.value.trim() || TEXT_MODELS[0]; store.set('aozora.textModel', cfg.textModel); });
  $('#style').addEventListener('input', e => { cfg.style = e.target.value.trim() || DEFAULT_STYLE; store.set('aozora.style', cfg.style); });
  $('#loadModels').addEventListener('click', loadModels);
  $('#src').addEventListener('input', updateEstimate); $('#optRuby').addEventListener('change', updateEstimate);
  $('#fileIn').addEventListener('change', async e => { const f = e.target.files[0]; if (f) { $('#src').value = await readTextFile(f); updateEstimate(); } e.target.value = ''; });
  $('#loadJson').addEventListener('change', e => { const f = e.target.files[0]; if (f) importJSON(f); e.target.value = ''; });
  $('#saveJson').addEventListener('click', exportJSON);
  $('#portraitFile').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; const c = charById(pending.portrait); if (f && c) setPortrait(c, f); });
  $('#profileFile').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; const c = charById(pending.profile); if (f && c) startProfile(c, f); });
  // 칸을 살짝 벗어나 놓아도 브라우저가 그림 파일을 열어 버리지 않게 막는다
  window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('drop', e => { if (hasFiles(e)) e.preventDefault(); });
  $('#go').addEventListener('click', startAnalysis); $('#stop').addEventListener('click', stopAll);
  if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => renderAll());
  setInterval(() => { if (Object.values(state.steps).some(x => x.state === 'busy')) renderSteps(); }, 1000);
  renderAll();
}
window.__aozora = { cleanAozora, splitParagraphs, makeChunks, forceLayout, parseJSON, state, cfg, TIMEOUTS, noThinking, thinkingConfigFor, fmtWait, setPortrait, startProfile, ratioText, portraitPrompt, profilePrompt };
init();
})();
</script>
