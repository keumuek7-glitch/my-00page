<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>일본어 끝말잇기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
/* Layout: one narrow column. Setup sheet first; during a match a score bar, goal card, scrolling word chain and an input dock. Indigo = me, amber = computer. */
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --ink:#172033; --muted:#566377; --line:#D2D9E3;
  --me:#2B4C7E; --on-me:#FFFFFF; --me-soft:#DCE6F4;
  --cpu:#9A5B06; --cpu-soft:#FBEACB;
  --good:#2C7A58; --bad:#B0362E; --focus:#2B4C7E;
  --f-display:'Zen Antique','Hiragino Mincho ProN','Yu Mincho',serif;
  --f-body:'Zen Kaku Gothic New','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1525; --surface:#162036; --ink:#E9EEF6; --muted:#A0ACC1; --line:#2B3855;
    --me:#93B4EA; --on-me:#0E1525; --me-soft:#1E2E4D;
    --cpu:#EDB35A; --cpu-soft:#3A2C14;
    --good:#6CC49A; --bad:#F28B82; --focus:#93B4EA;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1525; --surface:#162036; --ink:#E9EEF6; --muted:#A0ACC1; --line:#2B3855;
  --me:#93B4EA; --on-me:#0E1525; --me-soft:#1E2E4D;
  --cpu:#EDB35A; --cpu-soft:#3A2C14;
  --good:#6CC49A; --bad:#F28B82; --focus:#93B4EA;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--f-body); font-size:15px; line-height:1.5;
  padding-block:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;min-height:0}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}

/* ---------- setup ---------- */
#setup{overflow-y:auto;gap:18px;padding-block:14px 0}
.kicker{margin:0;font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:700}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(42px,13vw,58px);line-height:1.05;margin:6px 0 0;letter-spacing:.02em}
h1 span{color:var(--cpu)}
.record{margin:10px 0 0;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.record b{font-weight:700}
.record .me{color:var(--me)} .record .cpu{color:var(--cpu)}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{padding:0;margin:0 0 8px;font-size:12px;letter-spacing:.08em;font-weight:700;color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{
  flex:1 1 0;min-width:76px;text-align:center;padding:11px 8px;line-height:1.2;
  border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-weight:500;
}
.seg input:checked + label{border-color:var(--me);background:var(--me-soft);color:var(--me);font-weight:700}
.seg input:focus-visible + label{outline:3px solid var(--focus);outline-offset:2px}
.rule{margin:10px 0 0;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:13.5px;color:var(--muted)}
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.check input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--me);flex:none}
.check small{display:block;color:var(--muted);font-size:12.5px}
.foot{margin:0;font-size:12.5px;color:var(--muted)}
.startbar{position:sticky;bottom:0;background:var(--bg);padding-block:10px 12px;display:grid;gap:8px}

.primary{
  background:var(--me);color:var(--on-me);border:0;border-radius:12px;
  padding:12px 18px;font:700 16px var(--f-body);min-height:48px;
}
.primary:disabled{opacity:.5;cursor:default}
.ghost{
  background:transparent;border:1.5px solid var(--line);border-radius:10px;
  padding:9px 12px;font:500 14px var(--f-body);min-height:44px;color:var(--ink);
}
.ghost:disabled{opacity:.45;cursor:default}

.pickrow{display:flex;align-items:center;gap:10px}
.pickval{
  flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 14px;
  background:var(--surface);border:1.5px solid var(--line);border-radius:10px;font-weight:700;
}
.pickval .k{font-family:var(--f-display);font-size:34px;line-height:1;font-weight:400;color:var(--me)}
.pickval .t{color:var(--muted);font-weight:500;font-size:14px}
.pickgrid{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.pickcells{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.pc{
  position:relative;height:46px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--ink);font:400 21px var(--f-display);padding:0;
}
.pc small{position:absolute;right:4px;bottom:1px;font:500 10px var(--f-body);color:var(--muted)}
.pc[aria-pressed="true"]{border-color:var(--me);background:var(--me-soft);color:var(--me)}
.pc:disabled{opacity:.3;cursor:default}
.pc-blank{display:block;height:46px}

/* ---------- game ---------- */
#game{padding-block:10px 12px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar .ghost{min-height:38px;padding:6px 12px}
.score{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums;font-weight:700}
.score b{font-size:24px}
.score .me{color:var(--me)} .score .cpu{color:var(--cpu)} .score .sep{color:var(--muted)}
.goal{
  display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px;
}
.goal-text{min-width:0;font-size:13px;color:var(--muted)}
.goal-text strong{display:block;color:var(--ink);font-size:15px;font-weight:700}
.goal-kana{font-family:var(--f-display);font-size:46px;line-height:1;min-width:1.3em;text-align:center}
.timer-row{display:flex;align-items:center;gap:10px;margin-top:8px;height:16px}
.timer{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--me)}
.timer.low i{background:var(--bad)}
#tLeft{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right}

.chain{
  flex:1;min-height:0;overflow-y:auto;list-style:none;margin:10px 0 0;padding:4px 2px 8px;
  display:flex;flex-direction:column;gap:10px;
}
.empty{align-self:center;color:var(--muted);font-size:13.5px;padding:28px 8px;text-align:center}
.card{
  max-width:88%;border:1px solid var(--line);border-radius:14px;padding:9px 14px;display:grid;gap:2px;
  animation:pop .22s ease-out;
}
.card.me{align-self:flex-end;border-color:var(--me);background:var(--me-soft);--hl:var(--me)}
.card.cpu{align-self:flex-start;border-color:var(--cpu);background:var(--cpu-soft);--hl:var(--cpu)}
.who{font-size:11px;font-weight:700;letter-spacing:.06em}
.me .who{color:var(--me)} .cpu .who{color:var(--cpu)}
.w{font-family:var(--f-display);font-size:30px;line-height:1.25;word-break:break-all}
.hl{color:var(--hl);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.sub{font-size:13px;color:var(--muted)}
.tag{justify-self:start;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px dashed var(--muted);color:var(--muted)}

#gjWrap{flex:1;min-height:0;overflow-y:auto;margin-top:10px}
.gj{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.gc{height:38px;display:grid;place-items:center;border-radius:8px;border:1.5px solid transparent;position:relative;font-family:var(--f-display);font-size:20px}
.gc.on{background:var(--bg);border-color:var(--line)}
.gc.t{border-color:var(--ink);background:var(--me-soft)}
.gc.s::before{content:"";position:absolute;left:5px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--me)}
.gc.e::after{content:"";position:absolute;right:5px;bottom:5px;width:7px;height:7px;border-radius:50%;border:2px solid var(--cpu)}
.legend{margin:8px 2px 0;font-size:12.5px;color:var(--muted)}

.notice{min-height:22px;margin-top:4px;font-size:13.5px;color:var(--muted)}
.notice.err{color:var(--bad);font-weight:500}
.notice.ok{color:var(--good)}
.dock{padding-top:6px;display:grid;gap:8px}
.row{display:flex;gap:8px}
#word{
  flex:1;min-width:0;font:500 20px var(--f-body);padding:10px 14px;
  border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);
}
#word:focus-visible{border-color:var(--me)}
.row.sub-row .ghost{flex:1}
.shake{animation:shake .3s}

.result{
  margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;display:grid;gap:8px;max-height:58%;overflow-y:auto;
}
.result h2{font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1.1;margin:0}
.result.win h2{color:var(--good)} .result.lose h2{color:var(--bad)}
.result p{margin:0;font-size:14px}
.result .nums{font-variant-numeric:tabular-nums;color:var(--muted)}
.result h3{margin:6px 0 0;font-size:12px;letter-spacing:.08em;color:var(--muted)}
.result ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:14px}
.result li span:first-child{font-family:var(--f-display);font-size:17px;margin-right:6px}
.result li small{color:var(--muted)}
.result .btns{display:flex;gap:8px;margin-top:6px}
.result .btns > *{flex:1}

@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){
  .card,.shake{animation:none}
}
</style>
</head>
<body>
<div id="app">

<section id="setup" class="screen">
  <header>
    <p class="kicker">일본어 1대1 대결</p>
    <h1 lang="ja">しりとり<span>対決</span></h1>
    <p class="record" id="record"></p>
  </header>

  <fieldset>
    <legend>모드</legend>
    <div class="seg">
      <input type="radio" name="mode" id="m-shiri" value="shiri" checked><label for="m-shiri">끝말잇기</label>
      <input type="radio" name="mode" id="m-start" value="start"><label for="m-start">시작 글자</label>
      <input type="radio" name="mode" id="m-end" value="end"><label for="m-end">끝 글자</label>
    </div>
    <p class="rule" id="rule"></p>
  </fieldset>

  <fieldset id="kanaField">
    <legend id="kanaLegend">시작 글자 지정</legend>
    <div class="pickrow">
      <div class="pickval" id="pickVal"></div>
      <button class="ghost" id="pickToggle" type="button" aria-expanded="false" aria-controls="pickGrid">오십음도에서 고르기</button>
    </div>
    <div class="pickgrid" id="pickGrid" hidden>
      <button class="ghost" id="pickRand" type="button"></button>
      <div class="pickcells" id="pickCells"></div>
    </div>
    <p class="foot" id="pickInfo"></p>
  </fieldset>

  <fieldset>
    <legend>컴퓨터 난이도</legend>
    <div class="seg">
      <input type="radio" name="level" id="l-easy" value="easy"><label for="l-easy">약함</label>
      <input type="radio" name="level" id="l-mid" value="mid" checked><label for="l-mid">보통</label>
      <input type="radio" name="level" id="l-hard" value="hard"><label for="l-hard">강함</label>
    </div>
  </fieldset>

  <fieldset>
    <legend>한 턴 제한 시간</legend>
    <div class="seg">
      <input type="radio" name="limit" id="t-0" value="0"><label for="t-0">없음</label>
      <input type="radio" name="limit" id="t-15" value="15"><label for="t-15">15초</label>
      <input type="radio" name="limit" id="t-30" value="30" checked><label for="t-30">30초</label>
      <input type="radio" name="limit" id="t-60" value="60"><label for="t-60">60초</label>
    </div>
  </fieldset>

  <fieldset>
    <legend>선공</legend>
    <div class="seg">
      <input type="radio" name="first" id="f-me" value="me" checked><label for="f-me">내가 먼저</label>
      <input type="radio" name="first" id="f-cpu" value="cpu"><label for="f-cpu">컴퓨터가 먼저</label>
    </div>
  </fieldset>

  <label class="check" for="strict">
    <input type="checkbox" id="strict">
    <span>내장 사전의 단어만 허용
      <small>끄면 사전에 없는 단어도 낼 수 있고, 「사전 외」로 표시됩니다.</small>
    </span>
  </label>

  <p class="foot" id="dictInfo"></p>

  <div class="startbar">
    <button class="primary" id="startBtn" type="button">시작하기</button>
  </div>
</section>

<section id="game" class="screen" hidden>
  <div class="bar">
    <button class="ghost" id="quitBtn" type="button">‹ 설정</button>
    <div class="score" aria-live="polite" aria-label="이번 대결 단어 수">
      <span class="me">나 <b id="sMe">0</b></span><span class="sep">:</span><span class="cpu"><b id="sCpu">0</b> 컴퓨터</span>
    </div>
  </div>

  <div class="goal">
    <div class="goal-text"><strong id="goalMain"></strong><span id="goalSub"></span></div>
    <div class="goal-kana" id="goalKana" lang="ja"></div>
  </div>

  <div class="timer-row" id="timerRow" hidden>
    <div class="timer" id="timer"><i id="timerFill"></i></div>
    <span id="tLeft"></span>
  </div>

  <ol class="chain" id="chain"></ol>

  <div id="gjWrap" hidden>
    <div class="gj" id="gj"></div>
    <p class="legend">● 시작 글자로 쓰임 · ○ 끝 글자로 쓰임 · 진한 테두리 = 지금 필요한 글자</p>
  </div>

  <div class="notice" id="notice" role="status" aria-live="polite"></div>

  <div class="dock" id="dock">
    <div class="row">
      <input id="word" type="text" lang="ja" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" placeholder="ねこ · ネコ · neko" aria-label="단어 입력">
      <button class="primary" id="sendBtn" type="button">제출</button>
    </div>
    <div class="row sub-row">
      <button class="ghost" id="hintBtn" type="button">힌트 3</button>
      <button class="ghost" id="gjBtn" type="button" aria-pressed="false">오십음도 표</button>
      <button class="ghost" id="giveBtn" type="button">항복</button>
    </div>
  </div>

  <div class="result" id="result" hidden>
    <h2 id="resTitle"></h2>
    <p id="resReason"></p>
    <p class="nums" id="resNums"></p>
    <p class="nums" id="resRec"></p>
    <div id="resMine"></div>
    <div id="resMissed"></div>
    <div class="btns">
      <button class="primary" id="againBtn" type="button">다시 하기</button>
      <button class="ghost" id="toSetupBtn" type="button">설정으로</button>
    </div>
  </div>
</section>

</div>

const SMALL = {'ゃ':'や','ゅ':'ゆ','ょ':'よ','ぁ':'あ','ぃ':'い','ぅ':'う','ぇ':'え','ぉ':'お','ゎ':'わ'};
const kataToHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const seion = c => c.normalize('NFD')[0];

function startKana(w){ return seion(w[0]); }
function endKana(w){
  let i = w.length - 1;
  while (i > 0 && (w[i] === 'ー' || w[i] === 'っ')) i--;
  let c = w[i];
  if (SMALL[c]) c = SMALL[c];
  return seion(c);
}
function startRange(w){ return [0, (w[1] && 'ゃゅょ'.includes(w[1])) ? 2 : 1]; }
function endRange(w){
  let i = w.length;
  while (i > 1 && w[i - 1] === 'ー') i--;
  const base = i - 1;
  const start = (base >= 1 && 'ゃゅょ'.includes(w[base])) ? base - 1 : base;
  return [start, w.length];
}

const DICT = [];
const BY_YOMI = new Map();
const BY_SURFACE = new Map();
RAW.trim().split('\n').forEach(line => {
  const [yomi, hyo, ko] = line.split('|').map(s => s.trim());
  if (!yomi || !ko || BY_YOMI.has(yomi)) return;
  const surface = hyo === '-' ? yomi : hyo;
  const e = { yomi, surface, ko };
  DICT.push(e);
  BY_YOMI.set(yomi, e);
  surface.split('・').forEach(sf => { if (!BY_SURFACE.has(sf)) BY_SURFACE.set(sf, e); });
});

const ROMA = {};
(function(){
  const rows = {'':'あいうえお', k:'かきくけこ', s:'さしすせそ', t:'たちつてと', n:'なにぬねの', h:'はひふへほ',
    m:'まみむめも', r:'らりるれろ', g:'がぎぐげご', z:'ざじずぜぞ', d:'だぢづでど', b:'ばびぶべぼ', p:'ぱぴぷぺぽ'};
  const V = 'aiueo';
  for (const [c, ks] of Object.entries(rows)) [...ks].forEach((k, i) => { ROMA[c + V[i]] = k; });
  Object.assign(ROMA, {ya:'や', yu:'ゆ', yo:'よ', wa:'わ', wo:'を', shi:'し', chi:'ち', tsu:'つ', fu:'ふ', ji:'じ',
    ja:'じゃ', ju:'じゅ', jo:'じょ', fa:'ふぁ', fi:'ふぃ', fe:'ふぇ', fo:'ふぉ'});
  const Y = {ky:'き', gy:'ぎ', sy:'し', sh:'し', ch:'ち', ty:'ち', jy:'じ', zy:'じ', ny:'に', hy:'ひ', my:'み', ry:'り', by:'び', py:'ぴ', dy:'ぢ'};
  for (const [p, k] of Object.entries(Y)) { ROMA[p + 'a'] = k + 'ゃ'; ROMA[p + 'u'] = k + 'ゅ'; ROMA[p + 'o'] = k + 'ょ'; }
})();

function romajiToHira(src){
  const s = src.toLowerCase().replace(/-/g, 'ー');
  let out = '', i = 0;
  while (i < s.length) {
    const c = s[i];
    if (c === 'ー') { out += 'ー'; i++; continue; }
    if (c === "'") { i++; continue; }
    if (c === 'n') {
      const n1 = s[i + 1], n2 = s[i + 2];
      if (n1 === 'n' && !(n2 && /[aiueoy]/.test(n2))) { out += 'ん'; i += 2; continue; }
      if (!n1 || !/[aiueoy]/.test(n1)) { out += 'ん'; i++; continue; }
    }
    if (i + 1 < s.length && c === s[i + 1] && /[bcdfghjkmpqrstvwxz]/.test(c)) { out += 'っ'; i++; continue; }
    if (c === 't' && s[i + 1] === 'c' && s[i + 2] === 'h') { out += 'っ'; i++; continue; }
    let hit = null;
    for (const L of [3, 2, 1]) {
      const k = s.substr(i, L);
      if (ROMA[k]) { hit = [ROMA[k], L]; break; }
    }
    if (!hit) return null;
    out += hit[0]; i += hit[1];
  }
  return out;
}

function parseWord(raw){
  const t = raw.replace(/[\s　]+/g, '');
  if (!t) return { err: '단어를 입력하세요.' };
  if (/[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(t)) return { err: '한글은 쓸 수 없습니다. 일본어 키보드나 로마자(neko)로 입력하세요.' };
  const ascii = /^[A-Za-z'\-]+$/.test(t);
  const s = ascii ? romajiToHira(t) : kataToHira(t);
  if (ascii && !s) return { err: '로마자를 히라가나로 바꾸지 못했습니다. 철자를 확인하세요.' };
  if (s && /^[ぁ-ゖー]+$/.test(s)) {
    if (/^[ぁぃぅぇぉっゃゅょゎー]/.test(s)) return { err: '작은 글자나 「ー」로 시작하는 단어는 쓸 수 없습니다.' };
    const e = BY_YOMI.get(s) || null;
    if (s.length < 2 && !e) return { err: '두 글자 이상의 단어를 입력하세요.' };
    return { reading: s, entry: e };
  }
  const e = BY_SURFACE.get(t);
  if (e) return { reading: e.yomi, entry: e };
  return { err: '히라가나·가타카나(또는 로마자)로 입력하세요. 한자는 사전에 있는 단어만 쓸 수 있습니다.' };
}

function kanaCounts(){
  const s = {}, e = {};
  DICT.forEach(w => {
    const a = startKana(w.yomi), b = endKana(w.yomi);
    s[a] = (s[a] || 0) + 1; e[b] = (e[b] || 0) + 1;
  });
  return { s, e };
}

    for (let i = 0; i < t.length;) {
      let j = i; while (j < t.length && mark[j] === mark[i]) j++;
      const seg = t.slice(i, j);
      if (mark[i]) { const sp = document.createElement('span'); sp.className = 'hl'; sp.textContent = seg; w.appendChild(sp); }
      else w.appendChild(document.createTextNode(seg));
      i = j;
    }
    li.append(who, w);
    if (item.entry) {
      const sub = document.createElement('span'); sub.className = 'sub';
      sub.textContent = (item.entry.surface !== t ? item.entry.surface + ' · ' : '') + item.entry.ko;
      li.appendChild(sub);
    } else {
      const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = '사전 외';
      li.appendChild(tag);
    }
    chain.appendChild(li);
    requestAnimationFrame(() => { chain.scrollTop = chain.scrollHeight; });
  }
  function place(who, reading, entry){
    const item = { who, reading, entry };
    S.chain.push(item); S.used.add(reading);
    S.startSet.add(startKana(reading)); S.endSet.add(endKana(reading));
    addCard(item); updateScore(); updateGJ();
  }

  /* ---------- flow ---------- */
  function showSetup(){
    if (S) { stopTimer(); clearTimeout(S.cpuT); }
    S = null;
    $('game').hidden = true; $('setup').hidden = false;
    paintRec(); updateRule();
  }
  function startGame(cfg){
    last = cfg;
    const { s, e } = kanaCounts();
    S = Object.assign({}, cfg, { chain: [], used: new Set(), target: null, turn: null, over: false, hints: 3,
      startSet: new Set(), endSet: new Set(), timerId: 0, cpuT: 0 });
    S.cpuWords = DICT.filter(() => Math.random() < LEVELS[cfg.level]);
    if (cfg.mode === 'shiri') S.target = cfg.kana || null;
    else if (cfg.kana) S.target = cfg.kana;
    else {
      const src = cfg.mode === 'start' ? s : e;
      let pool = Object.keys(src).filter(k => src[k] >= 8 && k !== 'ん' && k !== 'を');
      if (!pool.length) pool = Object.keys(src).filter(k => k !== 'ん' && k !== 'を');
      S.target = rand(pool);
    }
    $('setup').hidden = true; $('game').hidden = false;
    $('result').hidden = true; $('dock').hidden = false;
    $('gjWrap').hidden = true; $('chain').hidden = false;
    $('gjBtn').textContent = '오십음도 표'; $('gjBtn').setAttribute('aria-pressed', 'false');
    $('chain').innerHTML = '<li class="empty">여기에 단어가 이어집니다.</li>';
    $('word').value = ''; $('timerRow').hidden = true;
    $('hintBtn').textContent = '힌트 ' + S.hints;
    $('quitBtn').textContent = '‹ 설정';
    setNotice('', '');
    buildGJ(); updateGJ(); updateGoal(); updateScore();
    if (cfg.first === 'cpu') cpuTurn(); else userTurn();
  }
  function userTurn(){
    if (S.over) return;
    S.turn = 'me';
    setNotice('내 차례', '');
    startTimer();
    $('word').focus({ preventScroll: true });
  }
  function cpuTurn(){
    if (S.over) return;
    S.turn = 'cpu'; stopTimer(); $('timerRow').hidden = true;
    setNotice('컴퓨터가 생각 중…', '');
    S.cpuT = setTimeout(() => {
      if (S.over) return;
      const cand = S.cpuWords.filter(legal);
      if (!cand.length) return endGame('win', '컴퓨터가 낼 수 있는 단어가 없습니다.');
      let pick;
      if (S.level === 'hard' && S.mode === 'shiri') {
        const left = c => DICT.filter(w => w !== c && !S.used.has(w.yomi) && startKana(w.yomi) === endKana(c.yomi) && endKana(w.yomi) !== 'ん').length;
        const scored = cand.map(c => [left(c), c]);
        const min = Math.min(...scored.map(x => x[0]));
        pick = rand(scored.filter(x => x[0] === min))[1];
      } else pick = rand(cand);
      place('cpu', pick.yomi, pick);
      if (S.mode === 'shiri') S.target = endKana(pick.yomi);
      updateGoal(); updateGJ();
      userTurn();
    }, 700 + Math.random() * 900);
  }
  function bad(msg){
    setNotice(msg, 'err');
    const w = $('word'); w.classList.remove('shake'); void w.offsetWidth; w.classList.add('shake');
  }
  function submit(){
    if (!S || S.over) return;
    if (S.turn !== 'me') return setNotice('컴퓨터 차례입니다.', '');
    const p = parseWord($('word').value);
    if (p.err) return bad(p.err);
    const r = p.reading;
    if (S.used.has(r)) return bad('이미 나온 단어입니다.');
    if (S.mode === 'shiri') {
      if (S.target && startKana(r) !== S.target) return bad('「' + S.target + '」로 시작하는 단어여야 합니다.');
    } else if (S.mode === 'start') {
      if (startKana(r) !== S.target) return bad('「' + S.target + '」로 시작하는 단어여야 합니다.');
    } else if (endKana(r) !== S.target) return bad('「' + S.target + '」로 끝나는 단어여야 합니다.');
    if (S.strict && !p.entry) return bad('내장 사전에 없는 단어입니다. (엄격 모드)');
    stopTimer();
    place('me', r, p.entry);
    $('word').value = '';
    if (S.mode === 'shiri' && endKana(r) === 'ん') return endGame('lose', '「ん」으로 끝나는 단어를 냈습니다.');
    if (S.mode === 'shiri') S.target = endKana(r);
    updateGoal(); updateGJ();
    cpuTurn();
  }
  function hint(){
    if (!S || S.over || S.turn !== 'me') return;
    if (S.hints <= 0) return setNotice('힌트를 모두 썼습니다.', 'err');
    const pool = DICT.filter(legal);
    if (!pool.length) return setNotice('사전에서 찾은 후보가 없습니다. 아는 단어를 직접 입력해 보세요.', '');
    const w = rand(pool);
    S.hints--; $('hintBtn').textContent = '힌트 ' + S.hints;
    const relation = S.mode === 'end'
      ? '「' + endKana(w.yomi) + '」로 끝'
      : '「' + startKana(w.yomi) + '」로 시작';
    setNotice('힌트: ' + relation + ' · ' + [...w.yomi].length + '글자 · 뜻 ' + w.ko, 'ok');
  }
  function wordList(title, items, withKo){
    const wrap = document.createElement('div');
    if (!items.length) return wrap;
    const h = document.createElement('h3'); h.textContent = title;
    const ul = document.createElement('ul');
    items.forEach(it => {
      const li = document.createElement('li');
      const a = document.createElement('span'); a.lang = 'ja'; a.textContent = it.reading;
      const b = document.createElement('small');
      b.textContent = it.entry ? (it.entry.surface !== it.reading ? it.entry.surface + ' · ' : '') + it.entry.ko : '사전 외 · 직접 확인';
      li.append(a, b); ul.appendChild(li);
    });
    wrap.append(h, ul);
    return wrap;
  }
  function endGame(res, reason){
    if (!S || S.over) return;
    S.over = true; stopTimer(); clearTimeout(S.cpuT);
    if (res === 'win') rec.w++; else rec.l++;
    saveRec(); paintRec();
    const nMe = S.chain.filter(c => c.who === 'me').length;
    $('result').className = 'result ' + res;
    $('resTitle').textContent = res === 'win' ? '승리' : '패배';
    $('resReason').textContent = reason;
    $('resNums').textContent = '이번 대결 단어 수  나 ' + nMe + ' : ' + (S.chain.length - nMe) + ' 컴퓨터';
    $('resRec').textContent = '통산 전적  나 ' + rec.w + ' : ' + rec.l + ' 컴퓨터';
    const mine = $('resMine'); mine.textContent = '';
    mine.appendChild(wordList('내가 쓴 단어', S.chain.filter(c => c.who === 'me')));
    const missed = $('resMissed'); missed.textContent = '';
    if (res === 'lose') {
      const rest = DICT.filter(legal).sort(() => Math.random() - 0.5).slice(0, 5).map(w => ({ reading: w.yomi, entry: w }));
      missed.appendChild(wordList('이어갈 수 있었던 단어', rest));
    }
    $('dock').hidden = true; $('timerRow').hidden = true;
    $('gjWrap').hidden = true; $('chain').hidden = false;
    $('result').hidden = false;
    setNotice('', '');
  }
  function updateRule(){ $('rule').textContent = MODES[readSettings().mode].rule; }

  /* ---------- kana picker (setup) ---------- */
  function paintPick(){
    const m = curMode(), cnt = m === 'end' ? CNT.e : CNT.s, v = $('pickVal');
    v.textContent = '';
    const t = document.createElement('span'); t.className = 't';
    if (pick) {
      const k = document.createElement('span'); k.className = 'k'; k.lang = 'ja'; k.textContent = pick;
      t.textContent = m === 'end' ? '로 끝나는 단어' : '로 시작하는 단어';
      v.append(k, t);
    } else {
      t.textContent = m === 'shiri' ? '지정 안 함 (첫 단어 자유)' : '지정 안 함 (컴퓨터가 랜덤으로 정함)';
      v.appendChild(t);
    }
    $('pickInfo').textContent = pick
      ? '사전에 「' + pick + '」로 ' + (m === 'end' ? '끝나는' : '시작하는') + ' 단어가 ' + cnt[pick] + '개 있습니다.' + (cnt[pick] < 8 ? ' 적은 편이라 컴퓨터가 일찍 막힐 수 있습니다.' : '')
      : '';
  }
  function buildPick(){
    const m = curMode(), cnt = m === 'end' ? CNT.e : CNT.s;
    if (pick && !cnt[pick]) pick = '';
    $('kanaLegend').textContent = m === 'shiri' ? '첫 글자 지정 (선택)' : m === 'start' ? '시작 글자 지정' : '끝 글자 지정';
    $('pickRand').textContent = m === 'shiri' ? '지정 안 함 (자유)' : '지정 안 함 (랜덤)';
    const box = $('pickCells'); box.textContent = '';
    GJ.flat().forEach(k => {
      if (!k) { const sp = document.createElement('span'); sp.className = 'pc-blank'; box.appendChild(sp); return; }
      const b = document.createElement('button'); b.type = 'button'; b.className = 'pc'; b.lang = 'ja';
      b.dataset.k = k; b.textContent = k;
      const n = cnt[k] || 0; b.disabled = !n;
      const sm = document.createElement('small'); sm.textContent = n || ''; b.appendChild(sm);
      b.setAttribute('aria-pressed', String(pick === k));
      box.appendChild(b);
    });
    paintPick();
  }
  function togglePick(open){
    $('pickGrid').hidden = !open;
    $('pickToggle').setAttribute('aria-expanded', String(open));
    $('pickToggle').textContent = open ? '접기' : '오십음도에서 고르기';
  }
  $('pickToggle').addEventListener('click', () => togglePick($('pickGrid').hidden));
  $('pickRand').addEventListener('click', () => { pick = ''; buildPick(); togglePick(false); });
  $('pickCells').addEventListener('click', e => {
    const b = e.target.closest('.pc');
    if (!b || b.disabled) return;
    pick = b.dataset.k; buildPick(); togglePick(false);
  });

  /* ---------- events ---------- */
  document.querySelectorAll('input[name="mode"]').forEach(i => i.addEventListener('change', () => { updateRule(); buildPick(); }));
  $('startBtn').addEventListener('click', () => startGame(readSettings()));
  $('sendBtn').addEventListener('click', submit);
  $('word').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); submit(); }
  });
  $('hintBtn').addEventListener('click', hint);
  $('giveBtn').addEventListener('click', () => endGame('lose', '항복했습니다.'));
  $('gjBtn').addEventListener('click', () => {
    const show = $('gjWrap').hidden;
    $('gjWrap').hidden = !show; $('chain').hidden = show;
    $('gjBtn').setAttribute('aria-pressed', String(show));
    $('gjBtn').textContent = show ? '단어 목록' : '오십음도 표';
  });
  $('quitBtn').addEventListener('click', () => {
    if (!S || S.over) return showSetup();
    if (quitT) { clearTimeout(quitT); quitT = 0; return showSetup(); }
    $('quitBtn').textContent = '정말 나갈까요?';
    quitT = setTimeout(() => { quitT = 0; $('quitBtn').textContent = '‹ 설정'; }, 3000);
  });
  $('againBtn').addEventListener('click', () => startGame(last));
  $('toSetupBtn').addEventListener('click', showSetup);

  $('dictInfo').textContent = '내장 사전 ' + DICT.length + '단어 · 로마자(예: neko)로 입력해도 히라가나로 바뀝니다.';
  paintRec(); updateRule(); buildPick();
})();
</script>
</body>
</html>
